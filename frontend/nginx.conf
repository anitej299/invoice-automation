server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Docker Desktop can start this container before the backend. Resolve the
    # service at request time so nginx stays up and recovers when it is ready.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $backend_address backend:8000;
        proxy_pass http://$backend_address$request_uri;
        proxy_read_timeout 180s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
